<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — Inventario</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>Sistema de Inventario</h1>
            <p>Ingresa tus credenciales para continuar</p>

            <div id="alerta" class="alerta alerta-error"></div>

            <form id="formLogin">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" placeholder="admin" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary">Ingresar</button>
            </form>
        </div>
    </div>

    <script>
        const AUTH_URL = 'http://localhost:5000';

        document.getElementById('formLogin').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const alerta = document.getElementById('alerta');

            alerta.style.display = 'none';

            try {
                const response = await fetch(`${AUTH_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    window.location.href = '/inventario.html';
                } else {
                    alerta.textContent = data.error || 'Error al iniciar sesión';
                    alerta.style.display = 'block';
                }
            } catch (error) {
                alerta.textContent = 'No se pudo conectar al servidor de autenticación';
                alerta.style.display = 'block';
            }
        });
    </script>
</body>
</html>
